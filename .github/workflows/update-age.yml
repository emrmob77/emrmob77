name: Update README age

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate time on GitHub and update README
        run: |
          python - <<'PY'
          import re, datetime

          START = datetime.datetime(2024, 11, 12, 7, 42, 34, tzinfo=datetime.timezone.utc)
          now = datetime.datetime.now(datetime.timezone.utc)
          years = (now - START).total_seconds() / (365.2425 * 24 * 3600)

          text = open("README.md", encoding="utf-8").read()
          text = re.sub(
              r"(<!--AGE-->).*?(<!--/AGE-->)",
              lambda m: f"{m.group(1)}{years:.9f}{m.group(2)}",
              text,
              flags=re.S,
          )
          open("README.md", "w", encoding="utf-8").write(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update time counter"
          git push
